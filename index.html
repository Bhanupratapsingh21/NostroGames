<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NES Emulator (EmulatorJS)</title>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
    #controls { margin-bottom: 10px; }
    #game-container { width: 640px; height: 480px; max-width: 100%; margin: 0 auto; }
    #game { width: 100%; height: 100%; }
    p.instructions { font-size: 0.9rem; color: #ccc; }
    input, button { padding: 6px 12px; font-size: 1rem; margin-right: 8px; }
  </style>
</head>
<body>
  <h1>NES Emulator (EmulatorJS)</h1>
  <p class="instructions">
    Use the file picker to load a local <code>.nes</code> ROM you legally own, or click "Load Default" to play Super Mario Bros.<br>
    Serve this page over HTTP (e.g., <code>python -m http.server</code>) to allow WASM loading.
  </p>
  <div id="controls">
    <input type="file" id="file-input" accept=".nes">
    <button id="default-button">Load Default ROM</button>
  </div>
  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    // Prepare global config variables
    window.EJS_player = '#game';
    window.EJS_core = 'nes'; // NES core (fceumm)
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';
    // Default ROM URL
    const defaultUrl = 'https://cdn.jsdelivr.net/gh/bfirsh/jsnes-roms@master/Super_Mario_Bros.nes';
    window.EJS_gameUrl = defaultUrl;

    // Function to load EmulatorJS
    function loadEmulator() {
      // Remove any existing loader script
      const old = document.getElementById('loader-script');
      if (old) old.remove();
      // Inject the loader script
      const script = document.createElement('script');
      script.id = 'loader-script';
      script.src = 'https://cdn.emulatorjs.org/latest/data/loader.js';
      document.body.appendChild(script);
    }

    // Handle local file selection
    document.getElementById('file-input').addEventListener('change', e => {
      const file = e.target.files && e.target.files[0];
      if (file) {
        // Create blob URL for the selected file
        const url = URL.createObjectURL(file);
        window.EJS_gameUrl = url;
        loadEmulator();
      }
    });

    // Handle default button
    document.getElementById('default-button').addEventListener('click', () => {
      window.EJS_gameUrl = defaultUrl;
      loadEmulator();
    });

    // Initial load
    loadEmulator();
  </script>
</body>
</html>
